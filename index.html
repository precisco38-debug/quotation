<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Rate Calculator & PDF Exporter</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: inline-block; width: 180px; font-weight: bold; }
    select, button { padding: 5px 10px; font-size: 14px; }
    button { cursor: pointer; margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <h1>Interasia Line Rate Portal</h1>
  <p><strong>Validity:</strong> Sep 2026</p>

  <h2>Generate Freight Quotation</h2>
  <p>Select a country or specific destination port to instantly extract rates and download a formal PDF document.</p>

  <div class="form-group">
    <label for="country-select">Filter By Country</label>
    <select id="country-select">
      <option value="All">All Countries</option>
      <option value="Korea">Korea (韓國)</option>
      <option value="Japan">Japan (日本)</option>
      <option value="Taiwan">Taiwan (台灣)</option>
      <option value="China">China (中國)</option>
      <option value="India">India (印度)</option>
      <option value="Pakistan">Pakistan (巴基斯坦)</option>
      <option value="Vietnam">Vietnam (越南)</option>
      <option value="Malaysia">Malaysia (馬來西亞)</option>
      <option value="Thailand">Thailand (泰國)</option>
      <option value="Cambodia">Cambodia (柬埔寨)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="port-select">Specific Port (Optional)</label>
    <select id="port-select">
      <option value="All">All Ports</option>
    </select>
  </div>

  <button id="export-btn">Export Selected Rates as PDF</button>

  <script>
    // Port mappings per country
    const portData = {
      "Korea": ["Busan", "Incheon", "Gwangyang"],
      "Japan": ["Tokyo", "Yokohama", "Osaka", "Kobe", "Nagoya"],
      "Taiwan": ["Kaohsiung", "Keelung", "Taichung"],
      "China": ["Shanghai", "Ningbo", "Shenzhen", "Qingdao", "Tianjin"],
      "India": ["Nhava Sheva", "Mundra", "Chennai"],
      "Pakistan": ["Karachi", "Port Qasim"],
      "Vietnam": ["Ho Chi Minh", "Haiphong"],
      "Malaysia": ["Port Klang", "Penang"],
      "Thailand": ["Bangkok", "Laem Chabang"],
      "Cambodia": ["Sihanoukville"]
    };

    const countrySelect = document.getElementById('country-select');
    const portSelect = document.getElementById('port-select');

    countrySelect.addEventListener('change', function() {
      const selectedCountry = this.value;

      // Clear existing options
      portSelect.innerHTML = '<option value="All">All Ports</option>';

      // Populate ports if country exists in map
      if (selectedCountry && portData[selectedCountry]) {
        portData[selectedCountry].forEach(port => {
          const option = document.createElement('option');
          option.value = port;
          option.textContent = port;
          portSelect.appendChild(option);
        });
      }
    });
  </script>

</body>
</html>
