<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Rate Calculator & PDF Exporter</title>
    <!-- Tailwind CSS UI Utility Layer -->
    <script src="https://jsdelivr.net"></script>
    
    <!-- CRITICAL FIX: Sourced via highly stable cdnjs mirrors in strict binding order -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header navigation bar -->
    <header class="bg-blue-900 text-white shadow-md py-5 px-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight">Interasia Line Rate Portal</h1>
            <span class="bg-blue-800 text-xs px-3 py-1.5 rounded-md font-mono border border-blue-700">Validity: Sep 2026</span>
        </div>
    </header>

    <!-- Main Workspace UI Box -->
    <main class="max-w-4xl mx-auto my-10 p-8 bg-white rounded-xl shadow-xs border border-gray-100 w-full flex-grow">
        <h2 class="text-xl font-semibold mb-2">Generate Freight Quotation</h2>
        <p class="text-sm text-gray-500 mb-6">Select a country or specific destination port to instantly extract rates and download a formal PDF document.</p>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Filter By Country</label>
                <select id="countrySelect" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-blue-600 focus:bg-white transition" onchange="updatePortDropdown()">
                    <option value="ALL">All Countries</option>
                    <option value="JAPAN">Japan (日本)</option>
                    <option value="TAIWAN">Taiwan (台灣)</option>
                    <option value="CHINA">China (中國)</option>
                    <option value="INDIA">India (印度)</option>
                    <option value="PAKISTAN">Pakistan (巴基斯坦)</option>
                    <option value="VIETNAM">Vietnam (越南)</option>
                    <option value="MALAYSIA">Malaysia (馬來西亞)</option>
                    <option value="THAILAND">Thailand (泰國)</option>
                    <option value="KOREA">Korea (韓國)</option>
                    <option value="CAMBODIA">Cambodia (柬埔寨)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-600 mb-2">Specific Port (Optional)</label>
                <select id="portSelect" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-lg focus:outline-hidden focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                    <option value="ALL">All Ports</option>
                </select>
            </div>
        </div>

        <button onclick="generatePDF()" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-medium py-3.5 px-8 rounded-lg shadow-sm hover:shadow-md transition flex items-center justify-center gap-2 cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
            Export Selected Rates as PDF
        </button>
    </main>

    <!-- Footer component -->
    <footer class="text-center py-6 border-t border-gray-100 text-xs text-gray-400">
        © 2026 Interasia Line Automation Core. All Local Charges Reflected in SGD/USD.
    </footer>

            { country: "CAMBODIA", port: "PHNOM PENH", gp20: 200, gp40: 350, dg20: "NO DG", dg40: "NO DG", rf20: "N/A", rf40: "N/A" }

        function updatePortDropdown() {
            const country = document.getElementById("countrySelect").value;
            const portSelect = document.getElementById("portSelect");
            portSelect.innerHTML = '<option value="ALL">All Ports</option>';
            
            const filtered = country === "ALL" ? shippingDatabase : shippingDatabase.filter(x => x.country === country);
            const added = new Set();
            
            filtered.forEach(item => {
                if(!added.has(item.port)){
                    added.add(item.port);
                    const opt = document.createElement("option");
                    opt.value = item.port;
                    opt.textContent = item.port;
                    portSelect.appendChild(opt);
                }
            });
        }

        function generatePDF() {
            // FIXED ACCESS DECLARATION: Grab global instance window components explicitly
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4'); 
            
            const selectedCountry = document.getElementById("countrySelect").value;
            const selectedPort = document.getElementById("portSelect").value;

            let records = shippingDatabase;
            if (selectedCountry !== "ALL") records = records.filter(x => x.country === selectedCountry);
            if (selectedPort !== "ALL") records = records.filter(x => x.port === selectedPort);

            // Document branding top bar header
            doc.setFillColor(15, 32, 67); 
            doc.rect(0, 0, 297, 24, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
