<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Self-Help Shipping Rate Query System</title>
    <style>
        :root {
            --primary-color: #1a365d;
            --secondary-color: #2b6cb0;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --table-border: #e2e8f0;
            --text-color: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--table-border);
            padding-bottom: 10px;
        }

        .filter-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
            background: #edf2f7;
            padding: 15px;
            border-radius: 6px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--primary-color);
        }

        .form-group select {
            padding: 8px 12px;
            border: 1px solid #cbd5e0;
            border-radius: 4px;
            background-color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group select:focus {
            border-color: var(--secondary-color);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--table-border);
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            white-space: nowrap;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 12px;
            font-weight: 600;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            position: sticky;
            top: 0;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--table-border);
        }

        tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tr:hover {
            background-color: #edf2f7;
        }

        .no-results {
            padding: 30px;
            text-align: center;
            color: #718096;
            font-weight: 500;
        }

        .badge {
            background-color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
        }
        
        .badge-container {
            background-color: #feebc8;
            color: #c05621;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Customer Self-Help Freight Query Interface</h1>
    
    <div class="filter-section">
        <div class="form-group">
            <label for="countrySelect">Country of Port</label>
            <select id="countrySelect">
                <option value="ALL">All Countries</option>
            </select>
        </div>
        <div class="form-group">
            <label for="portSelect">Port Name</label>
            <select id="portSelect">
                <option value="ALL">All Ports</option>
            </select>
        </div>
        <div class="form-group">
            <label for="typeSelect">Container Type</label>
            <select id="typeSelect">
                <option value="ALL">All Types (GP20, GP40, GP40HC, TK20LD)</option>
                <option value="GP20">GP20</option>
                <option value="GP40">GP40</option>
                <option value="GP40HC">GP40HC</option>
                <option value="TK20LD">TK20LD</option>
            </select>
        </div>
    </div>

    <div class="table-responsive">
        <table>
            <thead>

                    <th>Validity</th>
                    <th>Port Name</th>

                    <th>GRI</th>
                    <th>HWS</th>
                    <th>BAF</th>
                    <th>OTH</th>
                    <th>AMS</th>
                    <th>DG3</th>
                    <th>DG2</th>
                    <th>THC 20</th>

                    <th>DIS - DG2</th>
                    <th>SEAL</th>
                    <th>BLF</th>
                    <th>BLS</th>
                    <th>SWB</th>
                    <th>TTL DG3 USD</th>

                    <th>TTL SGD</th>
                    <th>Cancellation USD</th>
                    <th>Service / Freq</th>
                    <th>T/T</th>
                    <th>Direct / Via</th>
                    <th>Detention @ POD</th>
                    <th>Remarks</th>
                </tr>
            </thead>
            <tbody id="rateTableBody">
                <!-- Dynamic rows parsed from manifest will build here -->
            </tbody>
        </table>
    </div>
</div>
