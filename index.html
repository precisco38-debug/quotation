<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Rates Query System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0275d8;
            margin-top: 0;
        }
        .search-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
        }
        select, input {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #0275d8;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            align-self: flex-end;
        }
        button:hover {
            background-color: #025aa5;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background-color: #0275d8;
            color: white;
            white-space: nowrap;
        }
        tr:hover {
            background-color: #f1f3f5;
        }
        .badge {
            background-color: #e9ecef;
            color: #495057;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Shipping Rates Query & Self-Help System</h1>
    <p>Query global logistics and container carrier rates across multiple routes instantly.</p>
    
    <div class="search-section">
        <div class="form-group">
            <label for="portName">Port Name</label>
            <input type="text" id="portName" placeholder="e.g. ADELAIDE, AUCKLAND, SHANGHAI...">
        </div>
        <div class="form-group">
            <label for="country">Country</label>
            <select id="country">
                <option value="all">All Countries</option>
                <option value="Australia">Australia</option>
                <option value="New Zealand">New Zealand</option>
                <option value="China">China</option>
                <option value="Korea">South Korea</option>
                <option value="Japan">Japan</option>
                <option value="Vietnam">Vietnam</option>
            </select>
        </div>
        <div class="form-group">
            <label for="containerType">Container Type</label>
            <select id="containerType">
                <option value="all">All Types</option>
                <option value="GP20">GP20</option>
                <option value="GP40">GP40</option>
                <option value="GP40HC">GP40HC</option>
                <option value="TK20LD">TK20LD</option>
            </select>
        </div>
        <button onclick="searchRates()">Search Rates</button>
    </div>

    <div class="table-responsive">
        <table id="ratesTable">
            <thead>
                <tr>
                    <th>CARRIER</th>
                    <th>Validity</th>
                    <th>PORT</th>
                    <th>GRI</th>
                    <th>Container Type</th>
                    <th>Rate (USD)</th>
                    <th>HWS</th>
                    <th>BAF</th>
                    <th>OTH</th>
                    <th>AMS</th>
                    <th>DG3</th>
                    <th>DG2</th>
                    <th>THC20</th>
                    <th>THC40</th>
                    <th>TTL USD</th>
                    <th>REMARKS</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Dynamic Content goes here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const shippingData = [
        { carrier: "ANL", validity: "30TH SEP", port: "ADELAIDE", country: "Australia", gri: "", type: "GP20", rate: 1900, hws: 0, baf: 0, oth: 0, ams: 0, dg3: 0, dg2: 0, thc20: 150, thc40: 250, remarks: "Direct Service" },
        { carrier: "ANL", validity: "30TH SEP", port: "ADELAIDE", country: "Australia", gri: "", type: "GP40", rate: 3800, hws: 0, baf: 0, oth: 0, ams: 0, dg3: 0, dg2: 0, thc20: 150, thc40: 250, remarks: "Direct Service" },
        { carrier: "ANL", validity: "30TH SEP", port: "ADELAIDE", country: "Australia", gri: "", type: "GP40HC", rate: 3800, hws: 0, baf: 0, oth: 0, ams: 0, dg3: 0, dg2: 0, thc20: 150, thc40: 250, remarks: "Direct Service" },
        { carrier: "ANL", validity: "30TH SEP", port: "BRISBANE", country: "Australia", gri: "", type: "GP20", rate: 1900, hws: 0, baf: 0, oth: 0, ams: 0, dg3: 0, dg2: 0, thc20: 150, thc40: 250, remarks: "Direct Service" },
        { carrier: "ANL", validity: "31ST AUG", port: "AUCKLAND", country: "New Zealand", gri: "", type: "GP20", rate: 1214, hws: 50, baf: 100, oth: 0, ams: 0, dg3: 50, dg2: 0, thc20: 180, thc40: 280, remarks: "Subject to BAF" },
        { carrier: "ANL", validity: "31ST AUG", port: "AUCKLAND", country: "New Zealand", gri: "", type: "GP40", rate: 2428, hws: 50, baf: 100, oth: 0, ams: 0, dg3: 50, dg2: 0, thc20: 180, thc40: 280, remarks: "Subject to BAF" },
        { carrier: "BENLINE", validity: "30TH SEP", port: "SHANGHAI", country: "China", gri: "", type: "GP20", rate: 1350, hws: 0, baf: 318, oth: 50, ams: 0, dg3: 50, dg2: 0, thc20: 120, thc40: 200, remarks: "Weekly Service" },
        { carrier: "COSCO", validity: "31ST AUG", port: "MELBOURNE", country: "Australia", gri: "INCL", type: "GP20", rate: 2529, hws: 100, baf: 718, oth: 29, ams: 0, dg3: 200, dg2: 0, thc20: 150, thc40: 250, remarks: "GRI Included" },
        { carrier: "EVERGREEN", validity: "31ST AUG", port: "TOKYO", country: "Japan", gri: "30", type: "GP20", rate: 1874, hws: 100, baf: 718, oth: 14, ams: 0, dg3: 200, dg2: 0, thc20: 160, thc40: 260, remarks: "Fast transit" }
    ];

    function searchRates() {
        const portInput = document.getElementById('portName').value.toUpperCase();
        const countryInput = document.getElementById('country').value;
        const typeInput = document.getElementById('containerType').value;
        
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';

        const filteredData = shippingData.filter(item => {
            const matchesPort = portInput === '' || item.port.includes(portInput);
            const matchesCountry = countryInput === 'all' || item.country === countryInput;
            const matchesType = typeInput === 'all' || item.type === typeInput;
            return matchesPort && matchesCountry && matchesType;
        });

        filteredData.forEach(item => {
            const ttlUsd = item.rate + item.hws + item.baf + item.oth + item.ams + item.dg3 + item.dg2;
            const row = `<tr>
                <td><strong>${item.carrier}</strong></td>
                <td>${item.validity}</td>
                <td>${item.port}</td>
                <td>${item.gri}</td>
                <td><span class="badge">${item.type}</span></td>
                <td>$${item.rate}</td>
                <td>$${item.hws}</td>
                <td>$${item.baf}</td>
                <td>$${item.oth}</td>
                <td>$${item.ams}</td>
                <td>$${item.dg3}</td>
                <td>$${item.dg2}</td>
                <td>$${item.thc20}</td>
                <td>$${item.thc40}</td>
                <td><strong>$${ttlUsd}</strong></td>
                <td>${item.remarks}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="16" style="text-align:center; color: #888;">No rates found matching your query criteria.</td></tr>';
        }
    }

    // Initial render
    window.onload = searchRates;
</script>

</body>
</html>
